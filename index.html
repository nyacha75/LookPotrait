<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>표정 조합 메이커</title>
    <style>
        /* === 기본 스타일 === */
        body {
            font-family: 'Malgun Gothic', '맑은 고딕', sans-serif;
            background-color: #f0f2f5;
            margin: 0;
            padding: 20px;
            display: flex;
            justify-content: center;
        }

        .main-container {
            display: flex;
            gap: 40px;
            max-width: 1200px;
            width: 100%;
            background: #ffffff;
            padding: 30px;
            border-radius: 15px;
            box-shadow: 0 8px 16px rgba(0,0,0,0.1);
        }

        /* === 왼쪽 패널 (선택 영역) === */
        .left-panel {
            flex: 1;
            display: flex;
            flex-direction: column;
            gap: 20px;
        }

        .category {
            background: #fafafa;
            border: 2px solid #e0e0e0;
            border-radius: 10px;
            padding: 15px;
        }

        .category-title {
            font-size: 18px;
            font-weight: bold;
            margin-bottom: 10px;
            color: #333;
        }

        /* 가로 스크롤 영역 */
        .scroll-area {
            display: flex;
            gap: 15px;
            overflow-x: auto;
            padding-bottom: 10px;
        }

        /* 스크롤바 디자인 */
        .scroll-area::-webkit-scrollbar {
            height: 10px;
        }
        .scroll-area::-webkit-scrollbar-track {
            background: #f1f1f1;
            border-radius: 5px;
        }
        .scroll-area::-webkit-scrollbar-thumb {
            background: #888;
            border-radius: 5px;
        }
        .scroll-area::-webkit-scrollbar-thumb:hover {
            background: #555;
        }

        /* 선택 아이템 (썸네일) */
        .item-btn {
            flex: 0 0 80px;
            height: 80px;
            background-color: #fff;
            border: 3px solid #ddd;
            border-radius: 10px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.2s;
            padding: 5px;
        }

        .item-btn img {
            width: 100%;
            height: 100%;
            object-fit: contain;
        }

        .item-btn:hover {
            border-color: #aaa;
        }

        .item-btn.active {
            border-color: #007bff;
            box-shadow: 0 0 8px rgba(0,123,255,0.4);
        }

        /* === 오른쪽 패널 (미리보기 및 목록 영역) === */
        .right-panel {
            flex: 1;
            display: flex;
            flex-direction: column;
            gap: 30px;
        }

        /* 상단: 최종 표정 미리보기 */
        .preview-section {
            display: flex;
            flex-direction: column;
            align-items: center;
            border: 2px solid #333;
            border-radius: 15px;
            padding: 20px;
            background-color: #fff;
        }

        .preview-title {
            font-size: 22px;
            font-weight: bold;
            margin-bottom: 20px;
        }

        #previewCanvas {
            width: 250px;
            height: 250px;
            border: 1px dashed #ccc;
            background-color: #fff;
            margin-bottom: 20px;
        }

        .add-btn {
            background-color: #fff;
            border: 3px solid #333;
            color: #333;
            font-size: 20px;
            font-weight: bold;
            padding: 10px 40px;
            border-radius: 10px;
            cursor: pointer;
            transition: all 0.2s;
        }

        .add-btn:hover {
            background-color: #333;
            color: #fff;
        }

        /* 하단: 수집된 표정 목록 및 저장 */
        .collection-section {
            border: 2px solid #ccc;
            border-radius: 15px;
            padding: 20px;
            display: flex;
            flex-direction: column;
            background-color: #fafafa;
            flex-grow: 1;
        }

        .collection-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(120px, 1fr));
            gap: 15px;
            margin-bottom: 20px;
            max-height: 300px;
            overflow-y: auto;
        }

        .collection-item {
            display: flex;
            flex-direction: column;
            align-items: center;
            background: #fff;
            border: 1px solid #ddd;
            padding: 10px;
            border-radius: 10px;
        }

        .collection-item img {
            width: 100px;
            height: 100px;
            object-fit: contain;
            border: 1px solid #eee;
            border-radius: 5px;
            margin-bottom: 10px;
        }

        .collection-item input {
            width: 90%;
            text-align: center;
            border: 1px solid #ccc;
            border-radius: 5px;
            padding: 5px;
            font-family: inherit;
        }

        /* 최종 저장 버튼 */
        .save-btn {
            background-color: #007bff;
            color: #fff;
            border: none;
            padding: 15px;
            font-size: 18px;
            font-weight: bold;
            border-radius: 10px;
            cursor: pointer;
            margin-top: auto;
            transition: background-color 0.2s;
        }

        .save-btn:hover {
            background-color: #0056b3;
        }
        
        .delete-btn {
            background: #ff4d4d;
            color: white;
            border: none;
            border-radius: 3px;
            padding: 2px 5px;
            font-size: 12px;
            cursor: pointer;
            margin-bottom: 5px;
            align-self: flex-end;
        }
    </style>
</head>
<body>

    <div class="main-container">
        <!-- 왼쪽 패널: 파츠 선택 -->
        <div class="left-panel" id="categoryContainer">
            <!-- 자바스크립트로 카테고리 HTML이 생성됩니다 -->
        </div>

        <!-- 오른쪽 패널: 결과물 및 리스트 -->
        <div class="right-panel">
            
            <!-- 상단: 최종 표정 -->
            <div class="preview-section">
                <div class="preview-title">최종 표정</div>
                <canvas id="previewCanvas" width="400" height="400"></canvas>
                <button class="add-btn" onclick="addToCollection()">추가</button>
            </div>

            <!-- 하단: 추가된 표정 목록 -->
            <div class="collection-section">
                <div class="collection-grid" id="collectionGrid">
                    <!-- 추가된 표정들이 여기에 들어갑니다 -->
                </div>
                <button class="save-btn" onclick="saveCombinedImage()">하나의 이미지로 저장</button>
            </div>

        </div>
    </div>

    <script>
        // ==========================================
        // 1. 임시 이미지 데이터 준비 (테스트용 Base64 SVG)
        // 실제 사용 시 'src' 값을 "images/눈썹1.png" 처럼 바꿔주세요.
        // ==========================================
        const svgBase = (content) => `data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200">${content}</svg>`;
        
        // 얼굴 윤곽선 (기본 베이스)
        const baseFaceSrc = svgBase(`<circle cx="100" cy="100" r="90" fill="white" stroke="black" stroke-width="4"/>`);

        const components = {
            eyebrows: [
                { id: 'b1', name: '기본', src: svgBase(`<path d="M50 70 Q 70 60 90 70 M110 70 Q 130 60 150 70" fill="none" stroke="black" stroke-width="5" stroke-linecap="round"/>`) },
                { id: 'b2', name: '축', src: svgBase(`<path d="M50 60 Q 70 70 90 80 M110 80 Q 130 70 150 60" fill="none" stroke="black" stroke-width="5" stroke-linecap="round"/>`) },
                { id: 'b3', name: '화남', src: svgBase(`<path d="M50 80 Q 70 70 90 60 M110 60 Q 130 70 150 80" fill="none" stroke="black" stroke-width="5" stroke-linecap="round"/>`) }
            ],
            eyes: [
                { id: 'e1', name: '기본', src: svgBase(`<circle cx="65" cy="100" r="10" fill="black"/><circle cx="135" cy="100" r="10" fill="black"/>`) },
                { id: 'e2', name: '눈감', src: svgBase(`<path d="M50 100 Q 65 115 80 100 M120 100 Q 135 115 150 100" fill="none" stroke="black" stroke-width="5" stroke-linecap="round"/>`) },
                { id: 'e3', name: '웃음', src: svgBase(`<path d="M50 100 Q 65 85 80 100 M120 100 Q 135 85 150 100" fill="none" stroke="black" stroke-width="5" stroke-linecap="round"/>`) }
            ],
            mouths: [
                { id: 'm1', name: '다문', src: svgBase(`<path d="M85 140 L115 140" fill="none" stroke="black" stroke-width="5" stroke-linecap="round"/>`) },
                { id: 'm2', name: '웃음', src: svgBase(`<path d="M80 140 Q 100 160 120 140" fill="none" stroke="black" stroke-width="5" stroke-linecap="round"/>`) },
                { id: 'm3', name: '와악', src: svgBase(`<path d="M80 140 Q 100 170 120 140 Z" fill="white" stroke="black" stroke-width="4"/>`) }
            ],
            effects: [
                { id: 'ef0', name: '없음', src: svgBase(``) },
                { id: 'ef1', name: '홍조', src: svgBase(`<ellipse cx="50" cy="115" rx="15" ry="8" fill="pink" opacity="0.8"/><ellipse cx="150" cy="115" rx="15" ry="8" fill="pink" opacity="0.8"/>`) },
                { id: 'ef2', name: '땀', src: svgBase(`<circle cx="160" cy="60" r="8" fill="skyblue"/><path d="M152 60 L160 45 L168 60 Z" fill="skyblue"/>`) }
            ]
        };

        // ==========================================
        // 2. 상태 관리 (현재 선택된 파츠 및 추가된 목록)
        // ==========================================
        let currentSelection = {
            eyebrows: components.eyebrows[0],
            eyes: components.eyes[0],
            mouths: components.mouths[0],
            effects: components.effects[0]
        };

        let savedFaces = []; // { id, dataURL, name }

        const canvas = document.getElementById('previewCanvas');
        const ctx = canvas.getContext('2d');

        // ==========================================
        // 3. UI 렌더링 및 인터랙션 로직
        // ==========================================

        // 왼쪽 패널(카테고리 메뉴) 그리기
        function initUI() {
            const container = document.getElementById('categoryContainer');
            const categories = [
                { key: 'eyebrows', label: '눈썹' },
                { key: 'eyes', label: '눈' },
                { key: 'mouths', label: '입' },
                { key: 'effects', label: '효과' }
            ];

            categories.forEach(cat => {
                const categoryDiv = document.createElement('div');
                categoryDiv.className = 'category';
                
                const title = document.createElement('div');
                title.className = 'category-title';
                title.innerText = cat.label;
                
                const scrollArea = document.createElement('div');
                scrollArea.className = 'scroll-area';
                scrollArea.id = `scroll-${cat.key}`;

                components[cat.key].forEach(item => {
                    const btn = document.createElement('div');
                    btn.className = 'item-btn';
                    if (currentSelection[cat.key].id === item.id) btn.classList.add('active');
                    
                    const img = document.createElement('img');
                    img.src = item.src;
                    img.alt = item.name;
                    
                    btn.appendChild(img);
                    btn.onclick = () => selectPart(cat.key, item, btn);
                    scrollArea.appendChild(btn);
                });

                categoryDiv.appendChild(title);
                categoryDiv.appendChild(scrollArea);
                container.appendChild(categoryDiv);
            });
        }

        // 파츠 선택 시 실행
        function selectPart(category, item, btnElement) {
            currentSelection[category] = item;
            
            // 기존 active 클래스 제거
            const parent = document.getElementById(`scroll-${category}`);
            const buttons = parent.getElementsByClassName('item-btn');
            for(let b of buttons) b.classList.remove('active');
            
            // 선택된 버튼 active 추가
            btnElement.classList.add('active');
            
            // 캔버스 업데이트
            updatePreview();
        }

        // 이미지 로딩을 위한 헬퍼 함수
        function loadImage(src) {
            return new Promise((resolve) => {
                const img = new Image();
                img.crossOrigin = "Anonymous"; // CORS 문제 방지
                img.onload = () => resolve(img);
                img.src = src;
            });
        }

        // 현재 선택된 파츠들로 캔버스 조합
        async function updatePreview() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            
            // 베이스 및 파츠 이미지 로드
            const baseImg = await loadImage(baseFaceSrc);
            const browImg = await loadImage(currentSelection.eyebrows.src);
            const eyeImg = await loadImage(currentSelection.eyes.src);
            const mouthImg = await loadImage(currentSelection.mouths.src);
            const effectImg = await loadImage(currentSelection.effects.src);

            // 순서대로 그리기 (효과 -> 눈썹 -> 눈 -> 입)
            ctx.drawImage(baseImg, 0, 0, canvas.width, canvas.height);
            ctx.drawImage(effectImg, 0, 0, canvas.width, canvas.height);
            ctx.drawImage(browImg, 0, 0, canvas.width, canvas.height);
            ctx.drawImage(eyeImg, 0, 0, canvas.width, canvas.height);
            ctx.drawImage(mouthImg, 0, 0, canvas.width, canvas.height);
        }

        // [추가] 버튼 클릭 시 하단 목록에 저장
        function addToCollection() {
            const dataURL = canvas.toDataURL('image/png');
            const faceId = Date.now();
            savedFaces.push({
                id: faceId,
                dataURL: dataURL,
                name: `표정 ${savedFaces.length + 1}`
            });
            renderCollection();
        }

        // 하단 목록 UI 업데이트
        function renderCollection() {
            const grid = document.getElementById('collectionGrid');
            grid.innerHTML = ''; // 초기화

            savedFaces.forEach((face, index) => {
                const itemDiv = document.createElement('div');
                itemDiv.className = 'collection-item';

                // 삭제 버튼
                const delBtn = document.createElement('button');
                delBtn.className = 'delete-btn';
                delBtn.innerText = 'X';
                delBtn.onclick = () => {
                    savedFaces.splice(index, 1);
                    renderCollection();
                };

                const img = document.createElement('img');
                img.src = face.dataURL;

                const input = document.createElement('input');
                input.type = 'text';
                input.value = face.name;
                input.onchange = (e) => { face.name = e.target.value; }; // 이름 변경 시 객체 업데이트

                itemDiv.appendChild(delBtn);
                itemDiv.appendChild(img);
                itemDiv.appendChild(input);
                grid.appendChild(itemDiv);
            });
        }

        // ==========================================
        // 4. 모인 표정들을 하나의 커다란 이미지로 병합 및 저장
        // ==========================================
        async function saveCombinedImage() {
            if (savedFaces.length === 0) {
                alert("먼저 표정을 1개 이상 추가해주세요!");
                return;
            }

            // 배치 설정 (한 줄에 4개씩)
            const cols = Math.min(savedFaces.length, 4);
            const rows = Math.ceil(savedFaces.length / cols);
            
            // 각 썸네일 크기 및 여백
            const cellWidth = 300;
            const cellHeight = 350; // 이미지 300 + 텍스트 공간 50
            const padding = 40; // 전체 여백
            const gap = 20; // 썸네일 사이 여백

            // 최종 캔버스 크기 계산
            const finalCanvas = document.createElement('canvas');
            finalCanvas.width = (cols * cellWidth) + ((cols - 1) * gap) + (padding * 2);
            finalCanvas.height = (rows * cellHeight) + ((rows - 1) * gap) + (padding * 2);
            const fCtx = finalCanvas.getContext('2d');

            // 배경을 흰색으로 채우기 (투명 방지)
            fCtx.fillStyle = '#ffffff';
            fCtx.fillRect(0, 0, finalCanvas.width, finalCanvas.height);

            // 각 표정 순회하며 그리기
            for (let i = 0; i < savedFaces.length; i++) {
                const face = savedFaces[i];
                const img = await loadImage(face.dataURL);

                const colIdx = i % cols;
                const rowIdx = Math.floor(i / cols);

                const x = padding + (colIdx * (cellWidth + gap));
                const y = padding + (rowIdx * (cellHeight + gap));

                // 표정 이미지 그리기 (300x300)
                fCtx.drawImage(img, x, y, cellWidth, cellWidth);

                // 이름 텍스트 그리기 (이미지 아래 가운데 정렬)
                fCtx.fillStyle = '#000000';
                fCtx.font = 'bold 24px "Malgun Gothic", sans-serif';
                fCtx.textAlign = 'center';
                fCtx.fillText(face.name, x + (cellWidth / 2), y + cellWidth + 30);
            }

            // 다운로드 트리거
            const link = document.createElement('a');
            link.download = '나의_표정_모음.png';
            link.href = finalCanvas.toDataURL('image/png');
            link.click();
        }

        // 초기화 실행
        initUI();
        updatePreview();

    </script>
</body>
</html>
